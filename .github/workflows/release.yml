name: release

# Fires on any version tag (v0.1.0, v1.2.3, ...). GoReleaser cross-builds both
# binaries for linux/macOS/windows × amd64/arm64 and attaches archives +
# checksums to the GitHub Release. Uses the workflow's built-in GITHUB_TOKEN —
# no PAT needed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # match the toolchain pinned in go.mod

      - name: Run tests
        run: go test ./...

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
